      }

        box-shadow: none;

        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }

        border-radius: 15px;
        text-align: center;
        margin-top: 10px;
        margin-bottom: 10px;
      }

        animation: slideInDown 1s ease forwards;

      @keyframes slideInDown {
        from {
          transform: translateY(-100%);

        }

        to {
